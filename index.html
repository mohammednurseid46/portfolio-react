    <script>
      // Apply saved theme before first paint (prevents a dark/light flash).
      try {
        var t = localStorage.getItem('ms-theme');
        var a = localStorage.getItem('ms-accent');
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
        if (a) document.documentElement.dataset.accent = a;
      } catch (e) {}
    </script>
  </head>

    <div id="root"></div>
