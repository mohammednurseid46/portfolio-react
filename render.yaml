services:
  - type: web
    name: portfolio-api
    runtime: node
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm run start:render
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: HASH_SALT
        sync: false
      - key: CORS_ORIGINS
        value: https://mohammednurseid46.github.io
      - key: DOCS_ENABLED
        value: "false"

  - type: static
    name: portfolio-frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        sync: false
